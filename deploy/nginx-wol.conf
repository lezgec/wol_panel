# Este archivo se incluye dentro del contexto http de Nginx (sites-enabled).
# Zonas y logs propios: no reemplaza hosts de SpamKill ni Cholesterol Game.
limit_req_zone $binary_remote_addr zone=wol_web:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wol_oauth:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wol_alexa:1m rate=20r/s;
log_format wol_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name wol.luiszamora.dev;
    access_log /var/log/nginx/wol-access.log wol_safe;
    return 301 https://wol.luiszamora.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name wol.luiszamora.dev;
    ssl_certificate /etc/nginx/ssl/spamkill-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/spamkill-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Solo confía en CF-Connecting-IP de las redes oficiales de Cloudflare.
    include /etc/nginx/snippets/wol-cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    access_log /var/log/nginx/wol-access.log wol_safe;
    error_log /var/log/nginx/wol-error.log warn;
    client_max_body_size 64k;
    limit_req_status 429;

    # No se sirve ningún archivo del proyecto desde Nginx.
    location ~ (^|/)\. { return 404; }
    location ~* ^/(instance|database|deploy|venv|__pycache__)(/|$) { return 404; }
    location ~* \.(py|sqlite3|db|sql|key|pem)$ { return 404; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_cache off;

    location = /oauth/token {
        limit_req zone=wol_oauth burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
    location = /oauth/authorize {
        limit_req zone=wol_oauth burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
    location = /alexa/smarthome {
        limit_req zone=wol_alexa burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
    location / {
        limit_req zone=wol_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
}
