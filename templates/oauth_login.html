<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincular con Alexa - WoL Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { height: 100vh; display: flex; align-items: center; justify-content: center; } .card-custom { border-radius: 1rem; width: 100%; max-width: 400px; padding: 2.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); } </style>
</head>
<body class="bg-body-secondary">
    <div class="card card-custom bg-body border text-center">
        <h3 class="fw-bold mb-3">Vinculación Alexa</h3>
        <p class="text-secondary small">Inicia sesión con tu cuenta verificada de WoL Pro para autorizar el control por voz.</p>
        {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="state" value="{{ state }}">
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">Autorizar Cuenta</button>
        </form>
    </div>
</body>
</html>
