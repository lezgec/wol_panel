<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WoL Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-custom { border-radius: 1rem; width: 100%; max-width: 420px; padding: 2.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .logo-text { font-weight: 800; font-size: 2.2rem; letter-spacing: 1px; color: #fff; }
        .logo-accent { font-weight: 400; color: #20c997; }
    </style>
</head>
<body class="bg-body-secondary">
    <div class="card card-custom bg-body border text-center">
        <div class="mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-dark rounded-4 p-3 mb-2 border border-secondary shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="45" height="45">
                    <defs>
                        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0d6efd" /><stop offset="100%" stop-color="#052c65" />
                        </linearGradient>
                        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#198754" /><stop offset="100%" stop-color="#20c997" />
                        </linearGradient>
                    </defs>
                    <circle cx="60" cy="60" r="54" fill="url(#primaryGrad)" opacity="0.25" />
                    <path d="M 28 52 L 42 80 L 60 46 L 78 80 L 92 52" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    <path d="M 60 26 L 60 44" stroke="#198754" stroke-width="8" stroke-linecap="round" />
                </svg>
            </div>
            <h2 class="logo-text m-0">WoL<span class="logo-accent">Pro</span></h2>
            <p class="text-secondary small mt-1">Panel de Control de Energía Remota</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" required autocomplete="email">
            </div>
            <div class="mb-2 text-start">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="text-end mb-3">
                <a href="/forgot-password" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
            </button>
        </form>

        <div class="border rounded-3 p-3 mt-2 text-center">
            <span class="text-secondary small">Encendido con Alexa o router compatible</span>
        </div>

        <div class="text-center mt-4">
            <a href="/register" class="text-decoration-none small text-secondary">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
