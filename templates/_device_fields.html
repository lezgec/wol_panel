{% macro device_fields(key, device=none) %}
<div class="row g-3">
    <div class="col-sm-6">
        <label for="name-{{ key }}" class="form-label">Nombre del equipo</label>
        <input id="name-{{ key }}" name="name" class="form-control" maxlength="100" value="{{ device[1] if device else '' }}" placeholder="PC Escritorio" required>
    </div>
    <div class="col-sm-6">
        <label for="mac-{{ key }}" class="form-label">Dirección MAC</label>
        <input id="mac-{{ key }}" name="mac" class="form-control font-monospace" maxlength="17" value="{{ device[2] if device else '' }}" placeholder="AA:BB:CC:DD:EE:FF" required>
    </div>
    <div class="col-12">
        <label for="method-{{ key }}" class="form-label">Método de encendido</label>
        <input type="hidden" name="wake_method" value="alexa">
        <p class="form-text">Alexa · Echo compatible en la misma red del PC.</p>
        {% if device and device[3] != 'alexa' %}<p class="form-text text-warning">Este equipo conserva una configuración anterior. Guardar lo configurará para encender con Alexa.</p>{% endif %}
    </div>

</div>
<p data-method-note class="small text-secondary mt-3 mb-0"></p>
{% endmacro %}
