<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - WoL Pro</title>
    {% include "_icons.html" %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style> body { height: 100vh; display: flex; align-items: center; justify-content: center; } .card-custom { border-radius: 1rem; width: 100%; max-width: 400px; padding: 2.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); } </style>
</head>
<body class="bg-body-secondary">
    <div class="card card-custom bg-body border text-center">
        <div class="mb-4">
            <i class="fa-solid fa-key fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold">Recuperar Acceso</h3>
            <p class="text-secondary small">Ingresa tu correo para enviarte un código de restablecimiento.</p>
        </div>
        {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="fa-solid fa-paper-plane me-2"></i> Enviar Código
            </button>
            <a href="/login" class="text-decoration-none small text-secondary">Volver al inicio de sesión</a>
        </form>
    </div>
</body>
</html>
