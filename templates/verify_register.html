<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Cuenta - WoL Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style> body { height: 100vh; display: flex; align-items: center; justify-content: center; } .card-custom { border-radius: 1rem; width: 100%; max-width: 400px; padding: 2.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); } </style>
</head>
<body class="bg-body-secondary">
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }} m-3" role="alert">{{ message }}</div>
    {% endfor %}
    <div class="card card-custom bg-body border text-center">
        <div class="mb-4">
            <i class="fa-solid fa-envelope-circle-check fa-3x text-success mb-3"></i>
            <h3 class="fw-bold">Verifica tu Correo</h3>
            <p class="text-secondary small">Hemos enviado un código de 6 dígitos a tu bandeja de entrada vía support@luiszamora.dev.</p>
        </div>
        {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4 text-start">
                <label class="form-label small fw-semibold">Código de Verificación</label>
                <input type="text" name="code" class="form-control text-center fw-bold fs-4" placeholder="123456" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="fa-solid fa-check me-2"></i> Activar Cuenta
            </button>
        </form>
        <form method="POST" class="mt-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" name="action" value="resend" class="btn btn-outline-secondary w-100">Reenviar código</button>
        </form>
    </div>
</body>
</html>
