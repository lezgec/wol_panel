services:
  wol:
    build: .
    env_file: .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - wol_state:/state
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  wol_state:
